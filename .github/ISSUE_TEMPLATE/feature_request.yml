name: Feature Request
description: Suggest a new capability, UI improvement, or timer mode
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape **TimeTube**! Please explain how your idea improves intentional YouTube usage, session productivity, and digital wellbeing.
        > Note: Features that encourage endless scrolling, engagement traps, or dark patterns are strictly out of scope.

  - type: dropdown
    id: feature-area
    attributes:
      label: Target Component or Feature Area
      description: Which part of TimeTube would this feature improve?
      options:
        - In-page Topbar Menu & Remaining Time Badge
        - Video Recommendation Pruning (Watch Sidebar / Home / Search)
        - Budget Modes (Countdown / Until HH:MM / Max Duration Cap)
        - Overrun Guard & Dynamic Playback Speed
        - Smart Shorts Guardrails
        - Silent Autoplay Verification
        - Clean Takeover & Lifecycle Auto-Reset
        - Extension Toolbar Popup & Settings
        - Localization / Duration Parser (ARIA / Languages)
        - Cross-browser / Mobile Support
        - Other / Multiple Areas
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What friction or limitation are you running into during a YouTube session?
      placeholder: "e.g., When using YouTube for study tutorials with a 30m timer, I want..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution & User Experience
      description: How should this look and behave inside YouTube or the TimeTube popover?
      placeholder: "Add an option in the topbar popover that..."
    validations:
      required: true

  - type: textarea
    id: implementation-notes
    attributes:
      label: Suggested Implementation / Architectural Notes (Optional)
      description: If you're familiar with TimeTube's codebase (`src/core/` vs. `src/content/`), share any technical ideas or edge cases.
      placeholder: "e.g., Extend `resolveBudget` in `src/core/policy.ts` and add unit tests in `tests/policy.test.ts`..."
    validations:
      required: false

  - type: dropdown
    id: pr-willingness
    attributes:
      label: Contribution Willingness
      description: Would you like to implement this and open a Pull Request (including unit tests in `tests/policy.test.ts`)?
      options:
        - "Yes, I would like to build this and open a PR"
        - "Maybe, with some guidance from maintainers"
        - "No, I am only proposing the idea"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please read every line carefully before ticking.
      options:
        - label: I have read the above instructions and searched existing issues to confirm this is not a duplicate.
          required: true
        - label: This idea supports digital wellbeing and intentional viewing (no engagement traps or endless-scroll enablers).
          required: true
        - label: I've ticked the checkboxes without reading their contents.
          required: false
