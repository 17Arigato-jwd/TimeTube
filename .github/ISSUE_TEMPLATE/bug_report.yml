name: Bug Report
description: Report a broken feature, visual glitch, or incorrect video filtering
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in **TimeTube**! Please fill out the sections below so we can reproduce and fix it quickly.
        > Tip: Before submitting, make sure you've reloaded the extension after updating—see [Troubleshooting and Updating](https://github.com/17Arigato-jwd/TimeTube#troubleshooting-and-updating).

  - type: dropdown
    id: install-source
    attributes:
      label: Installation Source
      description: How did you install TimeTube?
      options:
        - Firefox Add-ons Store (AMO)
        - Opera Addons Store
        - Chrome Web Store
        - Microsoft Edge Add-ons
        - Loaded unpacked from source / GitHub
        - Downloaded CI / Release ZIP
        - Other
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: TimeTube Version
      description: Check your browser's extension page (`chrome://extensions` or `about:addons`), e.g., v1.3.0 or commit hash.
      placeholder: "v1.3.0"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you using?
      options:
        - Google Chrome
        - Mozilla Firefox (Desktop)
        - Mozilla Firefox (Android / Nightly)
        - Brave Browser
        - Microsoft Edge
        - Opera
        - Opera GX
        - Vivaldi
        - Arc
        - Other (specify in version field below)
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser Exact Version
      description: Found in your browser's Help > About menu (e.g., Chrome 131.0.6778.86, Firefox 133.0).
      placeholder: "e.g., Chrome 131.0.6778.86"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Include OS name and version (e.g., Windows 11 24H2, macOS Sequoia 15.1, Ubuntu 24.04, Android 15).
      placeholder: "e.g., Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: affected-feature
    attributes:
      label: Affected TimeTube Feature
      description: Which TimeTube capability is malfunctioning?
      options:
        - In-page Topbar Menu & Remaining Time Badge
        - Watch Sidebar Video Pruning (4s live sweeps)
        - Home / Search Feed Pruning & Sparse Feed Nudging
        - Budget Modes (Countdown / Until HH:MM / Max Duration Cap)
        - Overrun Guard & Dynamic Playback Speed (<= 2x)
        - Smart Shorts Guardrails (Duration Pills / Nav Hiding / 3-Stage Escalation)
        - Silent Autoplay Verification
        - Clean Takeover ("Time's up") & 10s Lifecycle Auto-Reset
        - Extension Toolbar Popup
        - Other / Unsure
    validations:
      required: true

  - type: dropdown
    id: page-type
    attributes:
      label: YouTube Page Type
      description: Where on YouTube does the issue happen?
      options:
        - Watch page (/watch?v=...)
        - Home feed (https://www.youtube.com/)
        - Search results (/results?search_query=...)
        - Shorts player (/shorts/...)
        - Channel / Subscriptions page
        - Mobile YouTube (https://m.youtube.com/)
        - Global / Across all YouTube pages
        - N/A (Extension Toolbar Popup only)
    validations:
      required: true

  - type: dropdown
    id: timer-state
    attributes:
      label: Active Budget / Timer State
      description: What mode was TimeTube in when the bug happened?
      options:
        - Countdown Timer (15m / 25m / 45m or custom)
        - Clock End Time ("Until HH:MM")
        - Timer + Max Video Duration Cap active
        - Paused Countdown
        - Expired / Clean Takeover ("Time's up") active
        - Idle / No active session
        - Not sure
    validations:
      required: true

  - type: input
    id: video-url
    attributes:
      label: Example YouTube URL (Optional)
      description: Paste a link to a specific video, Short, LIVE stream, or search query that triggers the bug (helpful for duration parser edge cases).
      placeholder: "https://www.youtube.com/watch?v=..."
    validations:
      required: false

  - type: input
    id: other-extensions
    attributes:
      label: Other Active YouTube Extensions
      description: Extensions that modify YouTube's DOM can conflict (e.g., uBlock Origin, SponsorBlock, Return YouTube Dislike, Unhook). Write "None" if none are active.
      placeholder: "e.g., uBlock Origin, SponsorBlock (or 'None')"
    validations:
      required: false

  - type: textarea
    id: repro-steps
    attributes:
      label: Reproduction Steps & Expected vs. Actual Behavior
      description: Provide clear step-by-step instructions, what you expected TimeTube to do, and what actually happened.
      value: |
        **Steps to reproduce:**
        1. Set TimeTube budget to ...
        2. Go to ...
        3. Observe ...

        **Expected behavior:**
        

        **Actual behavior:**
        
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recordings (Required for UI/Visual Issues)
      description: |
        **Required if the bug involves visual glitches, misaligned elements, overlapping badges, missing topbar icons, or broken popovers/modals.** Drag and drop an image or video directly here. If strictly non-visual, write `N/A - Non-visual issue`.
      placeholder: "Drag and drop screenshot/recording here, or write 'N/A - Non-visual issue'..."
    validations:
      required: true

  - type: textarea
    id: console-logs
    attributes:
      label: Browser DevTools Console Errors
      description: |
        Press **F12** (or **Ctrl+Shift+I** / **Cmd+Option+I**) -> **Console** tab on the YouTube page (and if relevant, inspect the Background Service Worker on `chrome://extensions`), reproduce the bug, and paste any red error logs below.
      render: shell
      placeholder: "Paste red console errors here, or write 'None'..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please read every line carefully before ticking.
      options:
        - label: I have read the above instructions and am sure that this bug report belongs here.
          required: true
        - label: I have updated to the latest version (and reloaded the extension) following the Troubleshooting and Updating guide.
          required: true
        - label: I searched open and closed issues and confirmed this is not a duplicate.
          required: true
        - label: I confirmed this issue happens specifically because of TimeTube (and persists when conflicting YouTube extensions are disabled).
          required: true
        - label: I've ticked the checkboxes without reading their contents.
          required: false
