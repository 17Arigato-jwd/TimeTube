name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package extension bundle
        run: |
          mkdir -p build-artifact
          zip -r build-artifact/timetube-extension.zip \
            manifest.json \
            package.json \
            README.md \
            LICENSE \
            assets/ \
            dist/ \
            popup/

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetube-extension-build
          path: build-artifact/timetube-extension.zip
          retention-days: 14
