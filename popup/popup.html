<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeTube</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="tt-menu">
    <header class="tt-header">
      <div class="tt-brand">
        <img src="../assets/icon-32.png" alt="" width="20" height="20" class="tt-logo" />
        <h1>TimeTube</h1>
      </div>
      <span id="status-pill" class="tt-status tt-status-idle">Off</span>
    </header>

    <section id="schedule-strip" data-schedule-strip aria-label="Schedule status" hidden>
      <div id="schedule-budget" data-schedule-budget class="tt-budget-line" hidden>
        <strong id="schedule-status" data-schedule-status></strong>
        <span id="schedule-paused" data-schedule-paused hidden>Paused</span>
        <span id="schedule-reset" data-schedule-reset></span>
      </div>
      <div id="schedule-window" data-schedule-window hidden>
        <div class="tt-window-labels" aria-hidden="true">
          <span id="window-start" data-window-start></span>
          <strong id="window-now" data-window-now></strong>
          <span id="window-end" data-window-end></span>
        </div>
        <div id="window-progress" data-window-progress role="progressbar" aria-label="Scheduled access window"
             aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <div id="schedule-detail" data-schedule-detail hidden></div>
    </section>

    <section id="active-banner" class="tt-active-strip hidden">
      <div class="tt-active-meta">
        <span class="tt-caption">Time remaining</span>
        <strong id="remaining-display" class="tt-clock">--:--</strong>
      </div>
      <div class="tt-active-actions">
        <button id="extend-btn" type="button" class="tt-pill-btn tt-pill-tonal">+5 min</button>
        <button id="stop-btn" type="button" class="tt-pill-btn tt-pill-danger">Stop</button>
      </div>
    </section>

    <div id="session-setup" class="hidden">
      <section class="tt-section">
        <div class="tt-tabs" role="tablist">
          <button type="button" class="tt-tab active" data-mode="countdown">Timer</button>
          <button type="button" class="tt-tab" data-mode="until">End time</button>
          <button type="button" class="tt-tab" data-mode="maxLength">Max length</button>
        </div>

        <div id="panel-countdown" class="tt-mode-panel">
          <div class="tt-chips">
            <button type="button" class="tt-chip" data-mins="15">15 min</button>
            <button type="button" class="tt-chip active" data-mins="25">25 min</button>
            <button type="button" class="tt-chip" data-mins="45">45 min</button>
          </div>
          <label class="tt-field-row">
            <span>Custom minutes</span>
            <input id="countdown-mins" type="number" min="1" max="360" value="25" class="tt-input" />
          </label>
        </div>

        <div id="panel-until" class="tt-mode-panel hidden">
          <label class="tt-field-row">
            <span>Stop watching at</span>
            <input id="until-time" type="time" value="17:00" class="tt-input" />
          </label>
        </div>

        <div id="panel-maxLength" class="tt-mode-panel hidden">
          <label class="tt-field-row">
            <span>Max video length (min)</span>
            <input id="max-length-mins" type="number" min="1" max="240" value="15" class="tt-input" />
          </label>
        </div>

        <button id="start-btn" type="button" class="tt-pill-btn tt-pill-primary tt-full">Start session</button>
      </section>
      <div class="tt-divider" role="separator"></div>
    </div>

    <p id="session-start-error" class="tt-field-error hidden" role="alert"></p>

    <section class="tt-section tt-settings">
      <h2 class="tt-section-label">Playback &amp; Shorts</h2>

      <label class="tt-setting-row">
        <span>Open Shorts in standard player</span>
        <span class="tt-switch">
          <input id="disable-shorts" type="checkbox" />
          <span class="tt-switch-track"><span class="tt-switch-knob"></span></span>
        </span>
      </label>

      <label class="tt-setting-row" id="cutoff-row">
        <span>Leave Shorts before end</span>
        <select id="shorts-cutoff" class="tt-select">
          <option value="5">5 min left</option>
          <option value="10">10 min left</option>
        </select>
      </label>

      <label class="tt-setting-row">
        <span>Videos over limit</span>
        <select id="exceed-action" class="tt-select">
          <option value="hide">Hide</option>
          <option value="dim">Dim</option>
        </select>
      </label>

      <label class="tt-setting-row">
        <span>Hide Shorts sidebar tab</span>
        <span class="tt-switch">
          <input id="hide-shorts-nav" type="checkbox" checked />
          <span class="tt-switch-track"><span class="tt-switch-knob"></span></span>
        </span>
      </label>

      <label class="tt-setting-row">
        <span>Show duration on Shorts</span>
        <span class="tt-switch">
          <input id="show-short-durations" type="checkbox" checked />
          <span class="tt-switch-track"><span class="tt-switch-knob"></span></span>
        </span>
      </label>

      <label class="tt-setting-row">
        <span>Disable video previews on hover</span>
        <span class="tt-switch">
          <input id="disable-hover-previews" type="checkbox" />
          <span class="tt-switch-track"><span class="tt-switch-knob"></span></span>
        </span>
      </label>
    </section>
    <button id="schedule-open" class="tt-schedule-link" type="button">
      <strong>Schedule</strong>
      <span class="tt-material-chevron" aria-hidden="true"></span>
    </button>
  </main>

  <dialog id="schedule-conflict" class="tt-conflict" aria-labelledby="conflict-title" aria-describedby="conflict-summary">
    <h2 id="conflict-title">Session exceeds your schedule</h2>
    <p id="conflict-summary"></p>
    <p id="conflict-extra"></p>
    <p id="conflict-error" class="tt-field-error" role="alert"></p>
    <div class="tt-conflict-actions">
      <button id="conflict-shorten" type="button" class="tt-pill-btn tt-pill-primary">Shorten session</button>
      <button id="conflict-extend" type="button" class="tt-pill-btn tt-pill-tonal">Add extra time</button>
      <form method="dialog"><button type="submit" class="tt-pill-btn tt-pill-tonal" autofocus>Cancel</button></form>
    </div>
  </dialog>

  <script type="module" src="../dist/popup.js"></script>
</body>
</html>
